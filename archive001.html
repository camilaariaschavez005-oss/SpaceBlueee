<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archive 001 | Space Blue</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#04152f;
    color:#f5f5f5;
    font-family:'Inter',sans-serif;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    padding:100px 0;
}

.archive-number{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:4px;
    font-size:1.4rem;
    opacity:.6;
    margin-bottom:20px;
}

h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:5rem;
    line-height:1;
    margin-bottom:20px;
}

.date{
    opacity:.6;
    margin-bottom:25px;
}

.intro{
    opacity:.8;
    line-height:1.8;
    margin-bottom:60px;
}

.card{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:50px;
}

.album-images{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.album-images img{
    width:100%;
    height:350px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:30px;
}

.card-type{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:3px;
    font-size:1rem;
    opacity:.6;
    margin-bottom:10px;
}

.card-title{
    font-size:2.5rem;
    margin-bottom:15px;
}

.card-note{
    line-height:1.8;
    opacity:.85;
}

.simple-card{
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:30px;
    margin-bottom:30px;
}

@media(max-width:768px){

    h1{
        font-size:3.5rem;
    }

    .album-images{
        grid-template-columns:1fr;
    }

    .album-images img{
        height:250px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="archive-number">
        ARCHIVE 001
    </div>

    <h1>MIS ESSENTIALS DE ESTE MES</h1>

    <div class="date">
        Septiembre 2026
    </div>

    <div class="intro">
        Música, lecturas, imágenes, objetos e ideas que decidí conservar
