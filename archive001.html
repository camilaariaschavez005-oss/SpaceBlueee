<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive 001 | Space Blue</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#04152f;
    color:#f5f5f5;
    font-family:'Inter',sans-serif;
}

.container{
    width:90%;
    max-width:850px;
    margin:auto;
    padding:100px 0;
}

.archive-number{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.4rem;
    letter-spacing:4px;
    opacity:.6;
    margin-bottom:15px;
}

h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:4rem;
    margin-bottom:10px;
}

.date{
    opacity:.5;
    margin-bottom:20px;
}

.intro{
    opacity:.8;
    line-height:1.8;
    margin-bottom:50px;
}

.card{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:40px;
}

.album-images{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.album-images img{
    width:100%;
    height:320px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:30px;
}

.card-type{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:3px;
    opacity:.6;
    margin-bottom:10px;
}

.card-title{
    font-size:2rem;
    margin-bottom:12px;
}

.card-note{
    opacity:.85;
    line-height:1.8;
}

@media(max-width:768px){

    h1{
        font-size:3rem;
    }

    .album-images{
        grid-template-columns:1fr;
    }

    .album-images img{
        height:240px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="archive-number">
        ARCHIVE 001
    </div>

    <h1>MIS ESSENTIALS DE ESTE MES</h1>

    <div class="date">
        Septiembre 2026
    </div>

    <div class="intro">
        Música, lecturas, imágenes, objetos e ideas que decidí conservar.
    </div>

    <div class="card">

        <div class="album-images">

    images/album001.png

    images/album002.png

</div>

        <div class="card-content">

            <div class="card-type">
                ALBUM
            </div>

            <div class="card-title">
                ORDER chaos ORDER
            </div>

            <div class="card-note">
                Primera entrada del archivo.
            </div>

        </div>

    </div>

</div>

</body
