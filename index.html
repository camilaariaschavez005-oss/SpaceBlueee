<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Space Blue</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#05152d;
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-family:Georgia, serif;
}

.container{
    max-width:900px;
    padding:40px;
}

h1{
    font-size:6rem;
    font-weight:300;
    letter-spacing:12px;
    margin-bottom:60px;
    white-space:nowrap;
}

.tagline{
    font-size:2rem;
    line-height:1.7;
    margin-bottom:15px;
}

.subtitle{
    font-size:1.1rem;
    opacity:.7;
    margin-bottom:50px;
}

.journal-text{
    margin-top:40px;
    font-size:0.9rem;
    letter-spacing:6px;
    opacity:.55;
    text-transform:uppercase;
}

@media (max-width:768px){

    h1{
        font-size:3rem;
        letter-spacing:6px;
        white-space:normal;
    }

    .tagline{
        font-size:1.3rem;
    }

}

</style>

</head>

<body>

<div class="container">

    <h1>SPACE BLUE</h1>

    <p class="tagline">
        Entre el ruido,<br>
        las cosas que permanecen.
    </p>

    <p class="subtitle">
        Para volver a lo que importa.
    </p>

    <p class="journal-text">
        JOURNAL 001
    </p>

</div>

</body>
</html>
