<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Blue</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#04152f;
    color:#f5f5f5;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-family:Georgia, serif;
}

.container{
    max-width:1000px;
    padding:40px;
}

h1{
    font-size:7rem;
    font-weight:300;
    letter-spacing:14px;
    margin-bottom:70px;
    white-space:nowrap;
}

.tagline{
    font-size:2rem;
    line-height:1.8;
    margin-bottom:20px;
}

.subtitle{
    font-size:1rem;
    opacity:.65;
}

.journal{
    margin-top:70px;
    font-size:.85rem;
    letter-spacing:8px;
    opacity:.45;
    text-transform:uppercase;
}

@media (max-width:768px){

    h1{
        font-size:3.5rem;
        letter-spacing:6px;
        white-space:normal;
    }

    .tagline{
        font-size:1.3rem;
    }

}
</style>

</head>

<body>

<div class="container">

    <h1>SPACE BLUE</h1>

    <p class="tagline">
        Entre el ruido,<br>
        las cosas que permanecen.
    </p>

    <p class="subtitle">
        Para volver a lo que importa.
    </p>

    <div class="journal">
        JOURNAL 001
    </div>

</div>

</body>
</html>
