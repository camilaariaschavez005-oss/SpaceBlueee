<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Blue</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#04152f;
    color:#f5f5f5;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    font-family:'Inter',sans-serif;
}

.container{
    width:90%;
    max-width:900px;
}

h1{
    font-size:7rem;
    font-weight:300;
    letter-spacing:14px;
    margin-bottom:70px;
}

.tagline{
    font-size:2rem;
    line-height:1.8;
    margin-bottom:20px;
}

.subtitle{
    font-size:1rem;
    opacity:.65;
}

.archive{
    display:inline-block;
    margin-top:70px;

    color:white;
    text-decoration:none;

    font-size:.85rem;
    letter-spacing:10px;
    opacity:.45;

    transition:.3s ease;
}

.archive:hover{
    opacity:1;
}

@media(max-width:768px){

    h1{
        font-size:3.5rem;
        letter-spacing:6px;
    }

    .tagline{
        font-size:1.3rem;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>SPACE BLUE</h1>

    <p class="tagline">
        Entre el ruido,<br>
        las cosas que permanecen.
    </p>

    <p class="subtitle">
        Para volver a lo que importa.
    </p>

    <a href="archive001.html" class="archive">
        ARCHIVE 001
    </a>
